events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /uploads/ {
            root /var/uploads/;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            types {
                application/javascript  js mjs;
                text/css                css;
                image/svg+xml           svg;
                font/woff2              woff2;
                font/woff               woff;
            }
        }
    }
}
