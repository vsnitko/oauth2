apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.serviceName }}
spec:
  selector:
    app: {{ .Values.backend.label }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-deployment
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.backend.label }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.label }}
    spec:
      containers:
        - name: spring-boot-container
          image: "vitalisnitko/spring:{{ .Values.backend.imageTag }}"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ .Values.configName }}
          env:
            {{- range .Values.backend.secrets }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: spring-secret
                  key: {{ .name }}
            {{- end }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "0.5Gi"
